<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kean Harrison</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Full-viewport desktop ── */
    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      overflow: hidden;
    }

    /* Portrait background */
    .screen-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
      filter: none;
      display: block;
    }

    /* Bottom gradient for dock legibility */
    .screen-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.72) 100%);
      opacity: 0.4;
    }

    /* ── Dock ── */
    .dock {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      overflow: visible;
      z-index: 10;
    }

    .dock-icon {
      width: 62px;
      height: 62px;
      border-radius: 12px;
      overflow: visible;
      cursor: pointer;
      border: none;
      padding: 0;
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      flex-shrink: 0;
      text-decoration: none;
      position: relative;
    }
    .dock-icon:hover { transform: scale(1.12) translateY(-3px); }

    .dock-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }

    /* Hover title tab */
    .dock-icon::before {
      content: attr(title);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245, 245, 245, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      z-index: 20;
    }
    .dock-icon:hover::before { opacity: 1; }

    .dock-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.3);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* ── Desktop Icons ── */
    .desktop-icon {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      z-index: 5;
    }
    .desktop-icon:hover {
      transform: translateY(-5px) scale(1.05);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
    }

    .folder-wrap {
      position: relative;
      width: 96px;
      height: 96px;
    }
    .folder-wrap .folder-base {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .folder-wrap .folder-logo {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 62%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .icon-label {
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="desktop">
    <img class="screen-bg" src="assets/bg.jpg" alt="" />
    <div class="screen-gradient"></div>

    <!-- Desktop Icons -->
    <div class="desktop-icon" style="left: 18%; top: 28%;">
      <div class="folder-wrap">
        <img class="folder-base" src="assets/icons/folder.png" alt="" />
        <img class="folder-logo" src="assets/icons/booz-allen.png" alt="Booz Allen" />
      </div>
      <span class="icon-label">Booz Allen</span>
    </div>

    <!-- Dock -->
    <div class="dock">
      <button class="dock-icon" id="btn-contacts" title="Contacts">
        <img src="assets/icons/contacts.png" alt="Contacts" />
      </button>
      <a class="dock-icon" href="https://www.linkedin.com/in/keanh/" target="_blank" rel="noopener" title="LinkedIn">
        <img src="assets/icons/linkedin.png" alt="LinkedIn" />
      </a>
      <a class="dock-icon" href="https://www.instagram.com/keanharrison/" target="_blank" rel="noopener" title="Instagram">
        <img src="assets/icons/instagram.png" alt="Instagram" />
      </a>
      <a class="dock-icon" title="Photos">
        <img src="assets/icons/photos.png" alt="Photos" />
      </a>
      <a class="dock-icon" href="https://x.com/keanharr?s=11" target="_blank" rel="noopener" title="X">
        <img src="assets/icons/x.png" alt="X" />
      </a>
    </div>

  </div>
</body>
</html>
