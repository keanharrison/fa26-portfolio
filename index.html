<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kean Harrison</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .macbook-frame {
      width: min(90vw, 1080px);
      aspect-ratio: 16 / 10;
      background: linear-gradient(175deg, #e6e6e6 0%, #d4d4d4 100%);
      border-radius: 22px;
      padding: 13px 13px 42px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.07),
        0 4px 12px rgba(0, 0, 0, 0.06),
        0 24px 64px rgba(0, 0, 0, 0.09);
      position: relative;
    }

    /* Camera dot */
    .macbook-frame::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.15);
    }

    /* Chin bar */
    .macbook-frame::after {
      content: '';
      position: absolute;
      bottom: 13px;
      left: 50%;
      transform: translateX(-50%);
      width: 28%;
      height: 3px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.1);
    }

    .macbook-screen {
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      border-radius: 10px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="macbook-frame">
    <div class="macbook-screen"></div>
  </div>
</body>
</html>
