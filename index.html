<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kean Harrison</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Full-viewport desktop ── */
    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      overflow: hidden;
    }

    /* Portrait background */
    .screen-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
      filter: none;
      display: block;
    }

    /* Bottom gradient for dock legibility */
    .screen-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.72) 100%);
      opacity: 0.4;
    }

    /* ── Dock ── */
    .dock {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      overflow: visible;
      z-index: 10;
    }

    .dock-icon {
      width: 62px;
      height: 62px;
      border-radius: 12px;
      overflow: visible;
      cursor: pointer;
      border: none;
      padding: 0;
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      flex-shrink: 0;
      text-decoration: none;
      position: relative;
    }
    .dock-icon:hover { transform: scale(1.12) translateY(-3px); }

    .dock-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }

    /* Hover title tab */
    .dock-icon::before {
      content: attr(title);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245, 245, 245, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      z-index: 20;
    }
    .dock-icon:hover::before { opacity: 1; }

    .dock-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.3);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════
       MacWindow component
    ══════════════════════════════════════════ */
    .mac-window {
      position: absolute;
      width: 620px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(246, 246, 246, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.22),
        0 8px 24px rgba(0, 0, 0, 0.28),
        0 28px 80px rgba(0, 0, 0, 0.42);
    }

    /* Title bar */
    .mac-titlebar {
      height: 28px;
      min-height: 28px;
      background: rgba(216, 216, 220, 0.97);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    .mac-titlebar:active { cursor: grabbing; }

    /* Traffic lights */
    .mac-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1;
    }
    .mac-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      cursor: default;
      padding: 0;
      flex-shrink: 0;
      transition: filter 0.1s ease;
    }
    .mac-btn-red    { background: #ff5f56; }
    .mac-btn-yellow { background: #ffbd2e; cursor: default; }
    .mac-btn-green  { background: #27c93f; cursor: default; }
    .mac-btn-red:hover { filter: brightness(0.88); }

    /* Title text */
    .mac-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.68);
      letter-spacing: -0.01em;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Scrollable content area */
    .mac-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 28px 32px;
      height: 500px;
      background: rgba(248, 248, 248, 0.97);
    }
    .mac-content::-webkit-scrollbar       { width: 7px; }
    .mac-content::-webkit-scrollbar-track { background: transparent; }
    .mac-content::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 4px;
    }
    .desktop-icon {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      z-index: 5;
    }
    .desktop-icon:hover {
      transform: translateY(-5px) scale(1.05);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
    }

    .folder-wrap {
      position: relative;
      width: 96px;
      height: 96px;
    }
    .folder-wrap .folder-base {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .icon-label {
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="desktop">
    <img class="screen-bg" src="assets/bg.jpg" alt="" />
    <div class="screen-gradient"></div>

    <!-- Desktop Icons rendered by JS -->

    <!-- Dock -->
    <div class="dock">
      <button class="dock-icon" id="btn-contacts" title="Contacts">
        <img src="assets/icons/contacts.png" alt="Contacts" />
      </button>
      <a class="dock-icon" href="https://www.linkedin.com/in/keanh/" target="_blank" rel="noopener" title="LinkedIn">
        <img src="assets/icons/linkedin.png" alt="LinkedIn" />
      </a>
      <a class="dock-icon" href="https://www.instagram.com/keanharrison/" target="_blank" rel="noopener" title="Instagram">
        <img src="assets/icons/instagram.png" alt="Instagram" />
      </a>
      <a class="dock-icon" title="Photos">
        <img src="assets/icons/photos.png" alt="Photos" />
      </a>
      <a class="dock-icon" href="https://x.com/keanharr?s=11" target="_blank" rel="noopener" title="X">
        <img src="assets/icons/x.png" alt="X" />
      </a>
    </div>

  </div>
  <script>
    // ══════════════════════════════════════════
    // MacWindow — reusable macOS window shell
    // Usage: MacWindow({ title, children })
    // ══════════════════════════════════════════
    let _zTop = 200;

    function _makeDraggable(win, handle) {
      let ox, oy, ol, ot;
      handle.addEventListener('mousedown', e => {
        if (e.target.classList.contains('mac-btn')) return;
        ox = e.clientX; oy = e.clientY;
        ol = parseInt(win.style.left) || 0;
        ot = parseInt(win.style.top)  || 0;
        win.style.zIndex = ++_zTop;
        const move = e => {
          win.style.left = ol + (e.clientX - ox) + 'px';
          win.style.top  = ot + (e.clientY - oy) + 'px';
        };
        const up = () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
        e.preventDefault();
      });
    }

    function MacWindow({ title = '', children = '' } = {}) {
      const win = document.createElement('div');
      win.className = 'mac-window';
      win.style.left   = 'calc(50% - 310px)';
      win.style.top    = 'calc(50% - 264px)';
      win.style.zIndex = ++_zTop;

      win.innerHTML = `
        <div class="mac-titlebar">
          <div class="mac-controls">
            <button class="mac-btn mac-btn-red"    aria-label="Close"></button>
            <button class="mac-btn mac-btn-yellow" aria-label="Minimize"></button>
            <button class="mac-btn mac-btn-green"  aria-label="Maximize"></button>
          </div>
          <span class="mac-title">${title}</span>
        </div>
        <div class="mac-content">${children}</div>
      `;

      win.querySelector('.mac-btn-red').addEventListener('click', () => win.remove());
      win.addEventListener('mousedown', () => { win.style.zIndex = ++_zTop; });
      _makeDraggable(win, win.querySelector('.mac-titlebar'));
      return win;
    }

    // ══════════════════════════════════════════
    // Experience data
    // ══════════════════════════════════════════
    const EXPERIENCES = [
      { id: 'booz-allen',       name: 'Booz Allen',       folderIcon: 'assets/icons/folder.png', left: '14%', top: '18%' },
      { id: 'uva-darden',       name: 'UVA Darden',       folderIcon: 'assets/icons/folder.png', left: '64%', top: '12%' },
      { id: 'anthropic',        name: 'Anthropic',        folderIcon: 'assets/icons/folder.png', left: '74%', top: '34%' },
      { id: 'stealth-startup',  name: 'Stealth Startup',  folderIcon: 'assets/icons/folder.png', left: '6%',  top: '42%' },
      { id: 'johnson-controls', name: 'Johnson Controls', folderIcon: 'assets/icons/folder.png', left: '20%', top: '60%' },
      { id: 'beats-by-dre',     name: 'Beats by Dre',     folderIcon: 'assets/icons/folder.png', left: '67%', top: '55%' },
      { id: 'keanfit',          name: 'KeanFit LLC',      folderIcon: 'assets/icons/folder.png', left: '78%', top: '66%' },
      { id: 'tsg',              name: 'TSG',              folderIcon: 'assets/icons/folder.png', left: '8%',  top: '68%' },
    ];

    function DesktopItem({ id, name, folderIcon, left, top }) {
      const el = document.createElement('div');
      el.className = 'desktop-icon';
      el.dataset.id = id;
      el.style.left = left;
      el.style.top  = top;
      el.innerHTML = `
        <div class="folder-wrap">
          <img class="folder-base" src="${folderIcon}" alt="" />
        </div>
        <span class="icon-label">${name}</span>
      `;
      return el;
    }

    const desktop = document.querySelector('.desktop');
    EXPERIENCES.forEach(exp => desktop.insertBefore(DesktopItem(exp), desktop.querySelector('.dock')));

    // ── Demo window (design approval only — remove after approval) ──
    const demo = MacWindow({ title: 'Experience', children: '' });
    desktop.appendChild(demo);
  </script>
</html>
