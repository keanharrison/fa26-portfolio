<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kean Harrison</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Full-viewport desktop ── */
    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      overflow: hidden;
    }

    /* Portrait background */
    .screen-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
      filter: none;
      display: block;
    }

    /* Bottom gradient for dock legibility */
    .screen-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.72) 100%);
      opacity: 0.4;
    }

    /* ── Dock ── */
    .dock {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      overflow: visible;
      z-index: 10;
    }

    .dock-icon {
      width: 62px;
      height: 62px;
      border-radius: 12px;
      overflow: visible;
      cursor: pointer;
      border: none;
      padding: 0;
      background: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      flex-shrink: 0;
      text-decoration: none;
      position: relative;
    }
    .dock-icon:hover { transform: scale(1.12) translateY(-3px); }

    .dock-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }

    /* Hover title tab */
    .dock-icon::before {
      content: attr(title);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245, 245, 245, 0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      z-index: 20;
    }
    .dock-icon:hover::before { opacity: 1; }

    .dock-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.3);
      margin: 0 4px;
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════
       MacWindow component
    ══════════════════════════════════════════ */
    .mac-window {
      position: absolute;
      width: 620px;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(246, 246, 246, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.22),
        0 8px 24px rgba(0, 0, 0, 0.28),
        0 28px 80px rgba(0, 0, 0, 0.42);
    }

    /* Title bar */
    .mac-titlebar {
      height: 28px;
      min-height: 28px;
      background: rgba(216, 216, 220, 0.97);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    .mac-titlebar:active { cursor: grabbing; }

    /* Traffic lights */
    .mac-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1;
    }
    .mac-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      cursor: default;
      padding: 0;
      flex-shrink: 0;
      transition: filter 0.1s ease;
    }
    .mac-btn-red    { background: #ff5f56; }
    .mac-btn-yellow { background: #ffbd2e; cursor: default; }
    .mac-btn-green  { background: #27c93f; cursor: default; }
    .mac-btn-red:hover { filter: brightness(0.88); }

    /* Title text */
    .mac-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.68);
      letter-spacing: -0.01em;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Scrollable content area */
    .mac-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 28px 28px 32px;
      height: 500px;
      background: rgba(248, 248, 248, 0.97);
    }
    .mac-content::-webkit-scrollbar       { width: 7px; }
    .mac-content::-webkit-scrollbar-track { background: transparent; }
    .mac-content::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 4px;
    }
    .desktop-icon {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      z-index: 5;
    }
    .desktop-icon:hover {
      transform: translateY(-5px) scale(1.05);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.35));
    }
    .desktop-icon.is-dragging,
    .desktop-icon.is-dragging:hover {
      transform: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.45));
      cursor: grabbing;
    }

    .folder-wrap {
      position: relative;
      width: 96px;
      height: 96px;
    }
    .folder-wrap .folder-base {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .icon-label {
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .desktop-icon.selected .folder-wrap {
      border-radius: 10px;
      outline: 2px solid rgba(255, 255, 255, 0.55);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="desktop">
    <img class="screen-bg" src="assets/bg.jpg" alt="" />
    <div class="screen-gradient"></div>

    <!-- Desktop Icons rendered by JS -->

    <!-- Dock -->
    <div class="dock">
      <button class="dock-icon" id="btn-contacts" title="Contacts">
        <img src="assets/icons/contacts.png" alt="Contacts" />
      </button>
      <a class="dock-icon" href="https://github.com/keanharrison" target="_blank" rel="noopener" title="GitHub">
        <img src="assets/icons/github.png" alt="GitHub" />
      </a>
      <a class="dock-icon" href="https://www.linkedin.com/in/keanh/" target="_blank" rel="noopener" title="LinkedIn">
        <img src="assets/icons/linkedin.png" alt="LinkedIn" />
      </a>
      <a class="dock-icon" href="https://www.instagram.com/keanharrison/" target="_blank" rel="noopener" title="Instagram">
        <img src="assets/icons/instagram.png" alt="Instagram" />
      </a>
      <a class="dock-icon" title="Photos">
        <img src="assets/icons/photos.png" alt="Photos" />
      </a>
      <a class="dock-icon" href="https://x.com/keanharr?s=11" target="_blank" rel="noopener" title="X">
        <img src="assets/icons/x.png" alt="X" />
      </a>
    </div>

  </div>
  <script>
    // ══════════════════════════════════════════
    // MacWindow — reusable macOS window shell
    // ══════════════════════════════════════════
    const desktop = document.querySelector('.desktop');
    let _zTop = 200;

    function MacWindow({ title = '', children = '' } = {}) {
      const win = document.createElement('div');
      win.className = 'mac-window';

      // Center on desktop in pixel coords
      const dr = desktop.getBoundingClientRect();
      const W = 620, TITLEBAR = 28, CONTENT_H = 500;
      win.style.width  = W + 'px';
      win.style.left   = Math.max(0, Math.round((dr.width  - W) / 2)) + 'px';
      win.style.top    = Math.max(0, Math.round((dr.height - (TITLEBAR + CONTENT_H)) / 2)) + 'px';
      win.style.zIndex = ++_zTop;

      win.innerHTML = `
        <div class="mac-titlebar">
          <div class="mac-controls">
            <button class="mac-btn mac-btn-red"    aria-label="Close"></button>
            <button class="mac-btn mac-btn-yellow" aria-label="Minimize"></button>
            <button class="mac-btn mac-btn-green"  aria-label="Maximize"></button>
          </div>
          <span class="mac-title">${title}</span>
        </div>
        <div class="mac-content">${children}</div>
      `;

      const content  = win.querySelector('.mac-content');
      const btnRed   = win.querySelector('.mac-btn-red');
      const btnYellow= win.querySelector('.mac-btn-yellow');
      const btnGreen = win.querySelector('.mac-btn-green');
      const titlebar = win.querySelector('.mac-titlebar');

      // Per-window state
      win._minimized  = false;
      win._maximized  = false;
      let savedLeft, savedTop, savedWidth, savedContentH;

      // Focus any window on click
      win.addEventListener('mousedown', () => { win.style.zIndex = ++_zTop; });

      // ── Red: close ──
      btnRed.addEventListener('click', () => {
        win.dispatchEvent(new CustomEvent('close-window', { bubbles: false }));
        win.remove();
      });

      // ── Yellow: minimize ──
      btnYellow.addEventListener('click', () => {
        win.style.display = 'none';
        win._minimized = true;
      });

      // ── Restore (called externally when folder is double-clicked while minimized) ──
      win.restore = () => {
        win.style.display = 'flex';
        win._minimized = false;
        win.style.zIndex = ++_zTop;
      };

      // ── Green: maximize / restore ──
      btnGreen.addEventListener('click', () => {
        const dr = desktop.getBoundingClientRect();
        if (!win._maximized) {
          // Save current geometry
          savedLeft      = parseFloat(win.style.left)  || 0;
          savedTop       = parseFloat(win.style.top)   || 0;
          savedWidth     = parseFloat(win.style.width) || W;
          savedContentH  = content.style.height || '';
          // Expand — leave 8px inset on sides/top, clear dock + small gap at bottom
          const PAD          = 8;
          const DOCK_RESERVE = Math.round(dr.height * 0.13); // clears dock area
          win.style.left     = PAD + 'px';
          win.style.top      = PAD + 'px';
          win.style.width    = (dr.width - PAD * 2) + 'px';
          content.style.height = (dr.height - PAD * 2 - DOCK_RESERVE - TITLEBAR) + 'px';
          win._maximized = true;
        } else {
          // Restore saved geometry
          win.style.left    = savedLeft  + 'px';
          win.style.top     = savedTop   + 'px';
          win.style.width   = savedWidth + 'px';
          content.style.height = savedContentH;
          win._maximized = false;
        }
      });

      // ── Drag titlebar — clamped to desktop bounds ──
      titlebar.addEventListener('mousedown', e => {
        if (e.target.classList.contains('mac-btn')) return;
        if (win._maximized) return; // no drag while maximized
        const startMX = e.clientX, startMY = e.clientY;
        const startL  = parseFloat(win.style.left) || 0;
        const startT  = parseFloat(win.style.top)  || 0;
        win.style.zIndex = ++_zTop;

        function onMove(e) {
          const dr     = desktop.getBoundingClientRect();
          const newL   = Math.max(0, Math.min(startL + (e.clientX - startMX), dr.width  - win.offsetWidth));
          const newT   = Math.max(0, Math.min(startT + (e.clientY - startMY), dr.height - win.offsetHeight));
          win.style.left = newL + 'px';
          win.style.top  = newT + 'px';
        }
        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup',   onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup',   onUp);
        e.preventDefault();
      });

      return win;
    }

    // ══════════════════════════════════════════
    // Experience data
    // ══════════════════════════════════════════
    const EXPERIENCES = [
      { id: 'booz-allen',       name: 'Booz Allen',       folderIcon: 'assets/icons/folder.png', left: '14%', top: '18%' },
      { id: 'uva-darden',       name: 'UVA Darden',       folderIcon: 'assets/icons/folder.png', left: '64%', top: '12%' },
      { id: 'anthropic',        name: 'Anthropic',        folderIcon: 'assets/icons/folder.png', left: '74%', top: '34%' },
      { id: 'stealth-startup',  name: 'Stealth Startup',  folderIcon: 'assets/icons/folder.png', left: '6%',  top: '42%' },
      { id: 'johnson-controls', name: 'Johnson Controls', folderIcon: 'assets/icons/folder.png', left: '20%', top: '60%' },
      { id: 'beats-by-dre',     name: 'Beats by Dre',     folderIcon: 'assets/icons/folder.png', left: '67%', top: '55%' },
      { id: 'keanfit',          name: 'KeanFit LLC',      folderIcon: 'assets/icons/folder.png', left: '78%', top: '66%' },
      { id: 'tsg',              name: 'TSG',              folderIcon: 'assets/icons/folder.png', left: '8%',  top: '68%' },
    ];

    // ══════════════════════════════════════════
    // Experience window content
    // ══════════════════════════════════════════
    const EXPERIENCE_CONTENT = {
      'booz-allen': {
        role: 'Software Engineer Intern',
        period: 'Jun 2025 – Aug 2025',
        bullets: [
          'Built internal data pipeline tooling using Python and AWS Lambda to automate report generation for federal clients.',
          'Contributed to a React-based dashboard for real-time mission analytics, reducing manual reporting time by 40%.',
          'Collaborated in agile sprints with a cross-functional team of engineers and analysts.',
          'Gained secret clearance exposure through secure development practices and classified environment protocols.',
        ]
      },
      'uva-darden': {
        role: 'Research Assistant',
        period: 'Jan 2025 – Present',
        bullets: [
          'Assisted faculty with research on consumer behavior and decision-making frameworks.',
          'Cleaned and analyzed large datasets using Python (pandas, matplotlib) for publication-ready outputs.',
          'Contributed to white papers exploring behavioral economics in digital product design.',
        ]
      },
      'anthropic': {
        role: 'AI Policy & Safety Intern',
        period: 'Summer 2024',
        bullets: [
          'Researched emergent behaviors in large language models and contributed to internal red-teaming evaluations.',
          'Drafted policy memos on responsible AI deployment for regulated industries.',
          'Participated in cross-functional working groups on model alignment and safety tooling.',
        ]
      },
      'stealth-startup': {
        role: 'Co-founder / Product Engineer',
        period: '2024 – Present',
        bullets: [
          'Building a B2B SaaS product in stealth — combining LLM-driven workflows with enterprise integrations.',
          'Responsible for product strategy, front-end engineering (React/Next.js), and early customer discovery.',
          'Iterating toward PMF with a small founding team; currently in closed beta.',
        ]
      },
      'johnson-controls': {
        role: 'Product Management Intern',
        period: 'Summer 2023',
        bullets: [
          'Supported the OpenBlue smart building platform team with competitive analysis and feature roadmapping.',
          'Conducted customer interviews and synthesized insights to inform Q3 sprint priorities.',
          'Delivered a presentation to senior leadership on IoT integration opportunities in commercial real estate.',
        ]
      },
      'beats-by-dre': {
        role: 'Brand Strategy Intern',
        period: 'Summer 2022',
        bullets: [
          'Worked within the brand and marketing organization on campaign strategy for product launches.',
          'Developed consumer persona frameworks used in go-to-market planning for a new headphone line.',
          'Presented findings on Gen Z audio culture trends to the brand leadership team.',
        ]
      },
      'keanfit': {
        role: 'Founder & CEO',
        period: '2021 – Present',
        bullets: [
          'Founded a fitness coaching business offering personalized training programs and nutrition guidance.',
          'Grew to 30+ active clients through social media marketing and referral-based growth.',
          'Managed scheduling, invoicing, and content creation — building operational systems from scratch.',
        ]
      },
      'tsg': {
        role: 'Technology Strategy Associate',
        period: '2023 – 2024',
        bullets: [
          'Supported digital transformation initiatives for enterprise clients across healthcare and finance verticals.',
          'Performed gap analyses comparing current-state IT architecture against best-in-class benchmarks.',
          'Contributed to client deliverables covering cloud migration, data governance, and vendor selection.',
        ]
      },
    };

    function buildWindowContent(id, exp) {
      const data = EXPERIENCE_CONTENT[id] || {};
      const role   = data.role   || '';
      const period = data.period || '';
      const bullets = (data.bullets || []).map(b => `<li>${b}</li>`).join('');
      return `
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;">
          <img src="${exp.folderIcon}" alt="" style="width:48px;height:48px;object-fit:contain;flex-shrink:0;" />
          <div>
            <div style="font-size:17px;font-weight:600;color:#1a1a1a;letter-spacing:-0.02em;">${exp.name}</div>
            <div style="font-size:13px;color:#555;margin-top:2px;">${role}</div>
            <div style="font-size:12px;color:#888;margin-top:1px;">${period}</div>
          </div>
        </div>
        <ul style="padding-left:18px;display:flex;flex-direction:column;gap:10px;">
          ${bullets}
        </ul>
        <style>
          .mac-content ul li {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
          }
        </style>
      `;
    }

    // ══════════════════════════════════════════
    // DesktopItem — draggable folder icon
    // ══════════════════════════════════════════
    const openWindows = {};

    function DesktopItem(exp) {
      const { id, name, folderIcon, left, top } = exp;
      const el = document.createElement('div');
      el.className = 'desktop-icon';
      el.dataset.id = id;
      el.style.left = left;
      el.style.top  = top;
      el.innerHTML = `
        <div class="folder-wrap">
          <img class="folder-base" src="${folderIcon}" alt="" />
        </div>
        <span class="icon-label">${name}</span>
      `;

      // ── Drag logic ──
      // elStartLeft/Top are read from getBoundingClientRect on mousedown
      // but are NOT written back to el.style until the drag threshold is
      // crossed — so a plain click never changes the folder's position.
      let active = false;
      let didDrag = false;
      let mouseStartX, mouseStartY;
      let elStartLeft, elStartTop;

      el.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        // Read current desktop-relative position without touching el.style
        const dr = desktop.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        elStartLeft  = er.left - dr.left;
        elStartTop   = er.top  - dr.top;
        active       = true;
        didDrag      = false;
        mouseStartX  = e.clientX;
        mouseStartY  = e.clientY;
        el.style.zIndex = ++_zTop;
        e.preventDefault();

        function onMove(e) {
          if (!active) return;
          const dx = e.clientX - mouseStartX;
          const dy = e.clientY - mouseStartY;
          if (!didDrag && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
            didDrag = true;
            // Commit px position to style only now, right before first move
            el.style.left = elStartLeft + 'px';
            el.style.top  = elStartTop  + 'px';
            el.classList.add('is-dragging');
          }
          if (!didDrag) return;

          const dr = desktop.getBoundingClientRect();
          const newLeft = Math.max(0, Math.min(elStartLeft + dx, dr.width  - el.offsetWidth));
          const newTop  = Math.max(0, Math.min(elStartTop  + dy, dr.height - el.offsetHeight));
          el.style.left = newLeft + 'px';
          el.style.top  = newTop  + 'px';
        }

        function onUp() {
          active = false;
          el.classList.remove('is-dragging');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup',   onUp);
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup',   onUp);
      });

      // ── Click / double-click ──
      let lastClickTime = 0;
      el.addEventListener('click', () => {
        if (didDrag) return; // drag ended — ignore

        // Select
        document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');

        // Double-click detection
        const now = Date.now();
        if (now - lastClickTime < 400) {
          if (openWindows[id]) {
            if (openWindows[id]._minimized) {
              openWindows[id].restore();
            } else {
              openWindows[id].style.zIndex = ++_zTop;
            }
          } else {
            const win = MacWindow({ title: name, children: buildWindowContent(id, exp) });
            openWindows[id] = win;
            win.addEventListener('close-window', () => delete openWindows[id]);
            desktop.appendChild(win);
          }
        }
        lastClickTime = now;
      });

      return el;
    }

    EXPERIENCES.forEach(exp => desktop.insertBefore(DesktopItem(exp), desktop.querySelector('.dock')));
  </script>
</html>
