<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work — Kean Harrison</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="inner-body">

  <header class="site-header">
    <a href="index.html" class="nav-logo">
      <img src="assets/headshot.jpg" alt="Kean Harrison" />
    </a>
    <nav class="topnav">
      <a href="index.html"><span class="nw">Home</span><span class="nh">Home</span></a>
      <a href="work.html" class="active"><span class="nw">Work</span><span class="nh">Work</span></a>
      <a href="personal.html"><span class="nw">Personal</span><span class="nh">Personal</span></a>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
  </header>

  <div class="resume-wrap">
    <iframe
      src="assets/kean_resume.pdf"
      class="resume-embed"
      title="Kean Harrison Resume">
      <p>Unable to display PDF inline. <a href="assets/kean_resume.pdf" target="_blank">Open resume ↗</a></p>
    </iframe>
  </div>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
  </script>

</body>
</html>
